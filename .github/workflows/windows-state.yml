name: windows-state

on:
  pull_request:
    paths:
      - "src/security/**"
      - "src/lib/**"
      - "src/config/**"
      - "src/editor/**"
      - "src/permission/**"
      - "src/memory/**"
      - "src/tools/glob.ts"
      - "src/tools/grep.ts"
      - "src/tools/within-project.ts"
      - "tests/security/**"
      - "tests/lib/**"
      - "tests/editor/**"
      - "tests/tools/**"
      - "tests/config/**"
      - "tests/memory/**"
      - "tests/permission/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/windows-state.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-state:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          bun-download-url: ${{ matrix.arch == 'arm64' && 'https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-windows-aarch64.zip' || '' }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Native ACL, SQLite and Windows path regressions
        run: bun test ./tests/security/windows-private-state.test.ts ./tests/lib/windows-paths.test.ts ./tests/lib/db.test.ts ./tests/editor/words.test.ts ./tests/editor/launch.test.ts ./tests/security/secret-paths.test.ts ./tests/tools/glob.test.ts ./tests/permission/evaluator.test.ts ./tests/permission/cross-project.test.ts ./tests/tools/within-project.test.ts

name: secrets

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Verify the allowlisted public test key
        run: |
          echo 'f7e180284d844f7d3b42328d2bcb3c3eabd31968bf7b6afd8c93452f67eb846a  tests/web/fixtures/secure-test-key.pem' | sha256sum --check
      - name: Scan all fetched Git history
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" git . \
            --config .gitleaks.toml --log-opts="--all" \
            --redact=100 --ignore-gitleaks-allow --no-banner
